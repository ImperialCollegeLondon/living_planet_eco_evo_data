# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # These are generic hooks to keep files clean and tidy
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   # This is python specific linting and formatting using ruff
  #   rev: v0.15.22
  #   hooks:
  #   # Run the linter.
  #   - id: ruff-check
  #     args: [--fix, --exit-non-zero-on-fix, --target-version, py312]
  #   # Run the formatter.
  #   - id: ruff-format
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   # This is markdown linting
  #   rev: v0.49.1
  #   hooks:
  #     - id: markdownlint
  #       exclude: '(^|/)rendered/|\.ipynb_checkpoints'
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.73
    hooks:
      - id: rumdl      # Lint only; add args [--fix] to auto-fix
      - id: rumdl-fmt  # Pure format, exits 0 on violations
  # - repo: https://github.com/lorenzwalthert/precommit
  #   # These are R specific tools to format and lint R code and check for common errors
  #   rev: v0.4.3.9035
  #   hooks:
  #     - id: parsable-R
  #     - id: no-browser-statement
  #     - id: no-debug-statement
  - repo: https://github.com/posit-dev/air-pre-commit
    # Air formatter for R codes - unfortunately this doesn't currently handle MyST
    # notebooks
    rev: 0.10.0
    hooks:
      - id: air-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    - id: codespell
      args: ["--toml", "pyproject.toml"]
      additional_dependencies:
        - tomli
